name: Test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.1'
            activesupport: '~> 6.1.0'
          - ruby-version: '3.2'
            activesupport: '~> 7.2.0'
          - ruby-version: '3.3'
            activesupport: '~> 8.0.0'
          - ruby-version: '3.4'
            activesupport: '~> 8.1.0'
          - ruby-version: '4.0'
            activesupport: '~> 8.1.0'
    env:
      ACTIVESUPPORT_VERSION: ${{ matrix.activesupport }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run test
        run: bundle exec rake spec
